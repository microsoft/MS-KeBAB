name: PR.$(date:yyyyMMdd)$(rev:.r)

trigger: none

pr:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self
  clean: true
  persistCredentials: true

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'
    addToPath: true
  displayName: Use python 3.12.x

- bash: |
    ./scripts/validation/build_and_test.sh
  displayName: Run tests and checks